<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scala ze zdjęcia</title><style>
body{font-family:Arial,sans-serif;background:#f3f5f8;margin:0;color:#172033}.wrap{max-width:900px;margin:30px auto;padding:0 16px}.card{background:white;padding:24px;border-radius:18px;box-shadow:0 10px 30px #0001}.upload{display:block;padding:32px;border:2px dashed #8994a7;border-radius:14px;text-align:center;cursor:pointer}input{display:none}img{display:none;max-width:100%;max-height:420px;margin:18px auto;border-radius:12px}button,a{display:block;width:100%;box-sizing:border-box;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#172033;color:white;text-align:center;text-decoration:none;font-weight:bold}button:disabled{opacity:.5}pre{display:none;background:#101522;color:#eef3ff;padding:18px;border-radius:12px;white-space:pre-wrap;overflow:auto}.box{background:#eef2f7;padding:12px;border-radius:10px;margin-bottom:16px}.ok{background:#eef8ef}.warn{background:#fff4e5}#copy,#gh{display:none}
</style></head><body><main class="wrap"><section class="card"><h1>Scala ze zdjęcia</h1><p>Zdjęcie → rozwiązanie → automatyczny commit do GitHuba.</p><div id="repo" class="box">Sprawdzam GitHub...</div><label class="upload" for="img">📷 <b>Zrób zdjęcie albo wybierz z galerii</b></label><input id="img" type="file" accept="image/*" capture="environment"><img id="preview"><button id="solve" disabled>Rozwiąż i wyślij na GitHub</button><div id="status"></div><div id="ghstatus" class="box" style="display:none"></div><pre id="result"></pre><button id="copy">Kopiuj kod Scala</button><a id="gh" target="_blank" rel="noopener">Otwórz na GitHubie</a></section></main><script>
const img=document.querySelector('#img'),preview=document.querySelector('#preview'),solve=document.querySelector('#solve'),status=document.querySelector('#status'),ghs=document.querySelector('#ghstatus'),result=document.querySelector('#result'),copy=document.querySelector('#copy'),gh=document.querySelector('#gh'),repo=document.querySelector('#repo');let code='';
fetch('/api/config').then(r=>r.json()).then(c=>repo.textContent=c.autoPush?`Zapis automatyczny: ${c.owner}/${c.repo} → ${c.branch}`:'GitHub nie jest skonfigurowany.').catch(()=>repo.textContent='Błąd konfiguracji GitHub.');
img.onchange=()=>{if(!img.files[0])return;preview.src=URL.createObjectURL(img.files[0]);preview.style.display='block';solve.disabled=false};
solve.onclick=async()=>{const fd=new FormData();fd.append('image',img.files[0]);solve.disabled=true;status.textContent='Generuję rozwiązanie...';result.style.display=copy.style.display=gh.style.display='none';ghs.style.display='none';try{const r=await fetch('/api/solve',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'Błąd');code=d.code||'';result.textContent=d.result;result.style.display='block';copy.style.display='block';status.textContent='✅ Gotowe';ghs.style.display='block';if(d.github){ghs.className='box ok';ghs.textContent=`✅ Zapisano: ${d.github.path}`;gh.href=d.github.url;gh.style.display='block'}else{ghs.className='box warn';ghs.textContent='⚠️ GitHub: '+(d.githubError||'błąd')}}catch(e){status.textContent='❌ '+e.message}finally{solve.disabled=false}};
copy.onclick=async()=>{await navigator.clipboard.writeText(code);copy.textContent='Skopiowano';setTimeout(()=>copy.textContent='Kopiuj kod Scala',1200)};
</script></body></html>
